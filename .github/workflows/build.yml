name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip KzinApp.zip
        if [ -d "KzinApp" ]; then mv KzinApp/* .; rmdir KzinApp; fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: true
        packages: 'platforms;android-34 build-tools;34.0.0'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.2

    # THIS IS THE MAGIC TRICK: It prints the exact error at the bottom!
    - name: Build APK (Show Error)
      run: |
        gradle assembleDebug > build_log.txt 2>&1 || (grep -i -A 5 "error:" build_log.txt && exit 1)

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Kzin-Client-APK
        path: app/build/outputs/apk/debug/app-debug.apk
